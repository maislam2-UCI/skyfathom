name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"   # daily: refresh satellite orbital elements
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run engine tests
        run: npm test
      - name: Refresh satellite TLEs (CelesTrak)
        run: node tools/fetch-tle.mjs || echo "TLE refresh failed; shipping the committed snapshot"
      - name: Refresh comet elements (Minor Planet Center)
        run: node tools/fetch-comets.mjs || echo "Comet refresh failed; shipping the committed snapshot"
      - name: Stamp service-worker cache version with the commit
        run: |
          sed -i "s/const VERSION = \"skyfathom-v[^\"]*\"/const VERSION = \"skyfathom-${GITHUB_SHA::8}\"/" src/sw.js
          sed -i "s/export const APP_VERSION = \"dev\"/export const APP_VERSION = \"$(date -u +%Y-%m-%d) · ${GITHUB_SHA::8}\"/" src/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
