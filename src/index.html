<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05070f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NightSky">
  <meta name="description" content="Night-sky map, AR star finder and astrophotography planner. Works offline, anywhere on Earth.">
  <title>NightSky</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="ui/app.css">
</head>
<body>
  <video id="cam" autoplay muted playsinline hidden></video>
  <canvas id="sky" aria-label="Sky map"></canvas>

  <header id="topbar">
    <button id="chip-loc" class="chip" title="Location"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span>…</span></button>
    <button id="chip-time" class="chip" title="Time"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm.5-13H11v6l5 3 .75-1.23-4.25-2.52z"/></svg><span>…</span></button>
    <span class="spacer"></span>
    <button id="btn-search" class="icon" title="Search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg></button>
    <button id="btn-settings" class="icon" title="Settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.7l-2-3.4a.5.5 0 0 0-.6-.2l-2.5 1a7.2 7.2 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 0-.5.5l-.4 2.6a7.2 7.2 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.4a.5.5 0 0 0 .1.7L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.7l2 3.4c.1.2.4.3.6.2l2.5-1a7.2 7.2 0 0 0 1.7 1l.4 2.6c0 .3.2.5.5.5h4c.3 0 .5-.2.5-.5l.4-2.6a7.2 7.2 0 0 0 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.4a.5.5 0 0 0-.1-.7L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
  </header>

  <div id="hud"></div>
  <div id="compass" title="View direction">
    <svg viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="29" class="ring"/>
      <g id="compass-rose">
        <path d="M32 6 L37 32 L32 58 L27 32 Z" class="needle"/>
        <path d="M32 6 L37 32 L27 32 Z" class="needle-n"/>
        <text x="32" y="16" class="n">N</text>
      </g>
      <path d="M32 3 L36 9 L28 9 Z" class="marker"/>
    </svg>
    <div id="compass-text">—</div>
  </div>

  <div id="ar-overlay" hidden>
    <div class="card">
      <h2>AR sky view</h2>
      <p>Point the phone at the sky. Needs motion sensors and (optionally) the camera. Both stay on your device.</p>
      <button id="ar-enable" class="primary">Enable sensors &amp; camera</button>
      <button id="ar-nocam" class="ghost">Sensors only (no camera)</button>
      <p id="ar-error" class="error" hidden></p>
    </div>
  </div>

  <aside id="panel" hidden></aside>
  <section id="info" hidden></section>
  <section id="sheet" hidden><div class="sheet-inner"></div></section>
  <div id="toast" hidden></div>
  <div id="loading"><div class="stars"></div><div class="stars s2"></div><div class="logo"><svg viewBox="0 0 64 64"><circle cx="22" cy="24" r="2.4"/><circle cx="40" cy="18" r="1.8"/><circle cx="46" cy="38" r="2.8"/><circle cx="30" cy="44" r="1.8"/><path d="M22 24 L40 18 L46 38 L30 44 Z"/></svg></div><div id="loading-text">Loading star catalogs…</div></div>

  <nav id="modes">
    <button data-mode="planetarium" class="active"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm6.9 8h-2.6a14 14 0 0 0-1.3-5.2A7 7 0 0 1 18.9 11zM12 5c.9 1.3 1.7 3.4 2.1 6H9.9C10.3 8.4 11.1 6.3 12 5zM5.3 13a7 7 0 0 1 0-2h2.6c-.1.7-.1 1.3 0 2H5.3zm.5 2h2.4c.3 1.9.8 3.7 1.5 5.2A7 7 0 0 1 5.8 15zm2.4-6H5.8A7 7 0 0 1 9.7 5.8 14 14 0 0 0 8.2 9zM12 19c-.9-1.3-1.7-3.4-2.1-6h4.2c-.4 2.6-1.2 4.7-2.1 6zm2.4-8H9.6c-.1-.7-.1-1.3 0-2h4.8c.1.7.1 1.3 0 2zm.3 9.2c.7-1.5 1.2-3.3 1.5-5.2h2.4a7 7 0 0 1-3.9 5.2zm1.7-7.2c.1-.7.1-1.3 0-2h2.6a7 7 0 0 1 0 2h-2.6z"/></svg><span>Map</span></button>
    <button data-mode="ar"><svg viewBox="0 0 24 24"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg><span>AR</span></button>
    <button data-mode="planner"><svg viewBox="0 0 24 24"><path d="M14 2.5a9.5 9.5 0 1 0 7.5 15.2A8 8 0 0 1 14 2.5zm5.5 1 .9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg><span>Tonight</span></button>
    <button data-mode="framing"><svg viewBox="0 0 24 24"><path d="M3 5a2 2 0 0 1 2-2h3v2H5v3H3V5zm18 0v3h-2V5h-3V3h3a2 2 0 0 1 2 2zM3 19v-3h2v3h3v2H5a2 2 0 0 1-2-2zm18 0a2 2 0 0 1-2 2h-3v-2h3v-3h2v3zM12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg><span>Frame</span></button>
  </nav>

  <script src="vendor/astronomy.browser.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
